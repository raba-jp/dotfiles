# mise グローバル設定
# dotfiles マニフェストはリポジトリ root の mise.toml にある。
# [dotfiles] をここに書いてはならない。[settings] は設定階層でマージされるため、
# 両方に存在するとリポジトリへ cd しただけで配布挙動が変わる。

[settings]
experimental = true
github_attestations = false

[tools]
"aqua:anomalyco/opencode" = "latest"
atuin = "latest"
bat = "latest"
eza = "latest"
fnox = "latest"
fzf = "latest"
ghq = "latest"
hk = "latest"
node = "lts"
claude-code = "latest"
codex = "latest"
gh = "latest"
ripgrep = "latest"
starship = "latest"
"ubi:wagoodman/dive" = "latest"
